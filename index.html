<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>90 дней</title>

    <meta name="theme-color" content="#F5F2EC">
    <meta name="description" content="Мой личный путь длиной в 90 дней">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <header class="top">
            <div>
                <div class="logo">90 дней</div>
                <div class="subtitle">Мой личный путь</div>
            </div>

            <button class="settings-button" aria-label="Настройки">
                ⚙
            </button>
        </header>

        <main>

            <section class="welcome">
                <p class="eyebrow">ТВОЙ НОВЫЙ ЭТАП</p>

                <h1>
                    Маленькие шаги.<br>
                    Большие изменения.
                </h1>

                <p class="intro">
                    90 дней, чтобы стать ближе к той жизни,
                    которую ты хочешь прожить.
                </p>
            </section>

            <section class="progress-section">

                <div class="progress-header">
                    <span>Прогресс</span>
                    <span>0%</span>
                </div>

                <div class="progress-line">
                    <div class="progress-fill"></div>
                </div>

                <div class="days">
                    <span>День 1</span>
                    <span>из 90</span>
                </div>

            </section>

            <section class="today">

                <div class="section-heading">
                    <div>
                        <p class="eyebrow">СЕГОДНЯ</p>
                        <h2>Мои шаги</h2>
                    </div>

                    <span class="date">1 октября</span>
                </div>

                <div class="empty-state">

                    <div class="empty-number">01</div>

                    <h3>Начало пути</h3>

                    <p>
                        Здесь появятся твои задачи
                        на сегодняшний день.
                    </p>

                    <button class="primary-button">
                        Добавить первый шаг
                    </button>

                </div>

            </section>

        </main>

        <nav class="bottom-navigation">

            <button class="nav-item active">
                <span>01</span>
                <small>Сегодня</small>
            </button>

            <button class="nav-item">
                <span>02</span>
                <small>До → После</small>
            </button>

            <button class="nav-item">
                <span>03</span>
                <small>90 дней</small>
            </button>

            <button class="nav-item">
                <span>04</span>
                <small>Итоги</small>
            </button>

        </nav>

    </div>

    <script src="app.js"></script>

</body>
</html>
